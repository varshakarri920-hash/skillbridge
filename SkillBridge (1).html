<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillBridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:{900:'#081426',800:'#0f2140',700:'#1a3560'},cy:{400:'#22d3ee',500:'#06b6d4'}}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:linear-gradient(180deg,#e6eefa 0,#f1f5f9 360px) fixed,#f1f5f9;color:#0f172a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.04);transition:box-shadow .2s,transform .2s}
.card.hv:hover{box-shadow:0 8px 24px rgba(15,23,42,.09);transform:translateY(-1px)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect}=React;
const REQ={"HTML/CSS":4,"JavaScript":4,"React":4,"Java":3,"Spring Boot":3,"SQL":3,"Git/GitHub":3,"REST APIs":4};
const DEMO={"HTML/CSS":4,"JavaScript":3,"React":1,"Java":4,"Spring Boot":1,"SQL":2,"Git/GitHub":2,"REST APIs":2};
const FINAL={"HTML/CSS":4,"JavaScript":4,"React":4,"Java":3,"Spring Boot":3,"SQL":2,"Git/GitHub":2,"REST APIs":2};
const ROLES=["Full-Stack Developer","Frontend Developer","Backend Developer","Data Analyst","AI/ML Engineer","Cybersecurity Analyst"];
const DEMO_USER={name:"Alex Kumar",email:"",college:"ABC Engineering College",degree:"B.Tech Computer Science",year:"2nd Year",role:"Full-Stack Developer",level:"Beginner",goal:"Become internship/job ready"};
const YEARS=["1st Year","2nd Year","3rd Year","4th Year","Graduate"],LEVELS=["Beginner","Intermediate","Advanced"],GOALS=["Become internship/job ready","Get a first internship","Switch into a tech role","Prepare for campus placements"];
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const QS=[
["HTML/CSS","How do you build a responsive layout?",["I haven't yet","Fixed widths and some media queries","Flexbox/Grid with media queries","Grid/Flexbox, fluid type, accessibility checks"]],
["JavaScript","What best describes your use of async JavaScript?",["Never used promises","Know callbacks only","Comfortable with promises and async/await","Handle error flows, closures and the event loop"]],
["React","What have you built with React?",["Nothing yet","Followed a tutorial","Small apps with state and props","Apps with hooks, context and routing"]],
["Java","How comfortable are you with Java OOP?",["Beginner syntax only","Classes and objects","Inheritance, interfaces, collections","Streams, generics, design patterns"]],
["Spring Boot","Have you built a Spring Boot service?",["No","Ran a starter project","Built simple controllers","Built REST services with JPA and validation"]],
["SQL","Which SQL can you write?",["None","Basic SELECT","JOINs and GROUP BY","Subqueries, indexes, schema design"]],
["Git/GitHub","How do you use Git?",["Not used","Commit and push","Branches and pull requests","Rebasing, conflict resolution, code review"]],
["REST APIs","How do you work with REST APIs?",["Unsure what they are","Called one API","Consume APIs with fetch and handle errors","Design endpoints, status codes and auth"]]];
const NAV=["Dashboard","Career Goal","Skill Assessment","Skill Gaps","Roadmap","Skill Proof","Job Readiness","Profile"];
const IC={"Dashboard":"M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z","Career Goal":"M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z","Skill Assessment":"M9 4h6v3H9zM7 5H5v15h14V5h-2M9 14l2 2 4-4","Skill Gaps":"M5 20V10M12 20V4M19 20v-7","Roadmap":"M6 4a2 2 0 100 4 2 2 0 000-4zM18 16a2 2 0 100 4 2 2 0 000-4zM8 6h5a3 3 0 010 6h-2a3 3 0 000 6h5","Skill Proof":"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4","Job Readiness":"M3 17l6-6 4 4 8-8M15 7h6v6","Profile":"M12 4a4 4 0 100 8 4 4 0 000-8zM4 20c0-4 4-6 8-6s8 2 8 6"};
const Icon=({n,c="w-5 h-5"})=><svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={IC[n]}/></svg>;
const status=(r,c)=>r-c<=0?"Strong":r-c===1?"Developing":"Critical";
const COL={Strong:"bg-emerald-500",Developing:"bg-amber-400",Critical:"bg-rose-500"};
const TXT={Strong:"text-emerald-700 bg-emerald-50 ring-emerald-200",Developing:"text-amber-700 bg-amber-50 ring-amber-200",Critical:"text-rose-700 bg-rose-50 ring-rose-200"};
const pct=s=>Math.round(Object.keys(REQ).reduce((a,k)=>a+Math.min(s[k],REQ[k]),0)/Object.values(REQ).reduce((a,b)=>a+b,0)*100);
const label=p=>p>=85?"Job Ready":p>=60?"Almost Ready":"Building Foundations";
const useMount=v=>{const [w,setW]=useState(0);useEffect(()=>{const t=setTimeout(()=>setW(v),40);return()=>clearTimeout(t)},[v]);return w};
const Card=({children,c="",hv})=><div className={"card p-5 "+(hv?"hv ":"")+c}>{children}</div>;
const Btn=({children,onClick,v="p",c="",...r})=><button onClick={onClick} {...r} className={"px-4 py-2.5 rounded-xl text-sm font-semibold transition active:scale-[.98] disabled:opacity-40 "+(v==="p"?"bg-blue-600 text-white shadow-sm hover:bg-blue-700":"bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 hover:border-slate-400")+" "+c}>{children}</button>;
const Title=({t,s})=><div className="mb-7"><h1 className="text-3xl font-extrabold tracking-tight text-navy-900">{t}</h1>{s&&<p className="text-sm text-slate-500 mt-1.5">{s}</p>}</div>;
const Eyebrow=({children})=><p className="text-[11px] font-semibold tracking-widest uppercase text-slate-500">{children}</p>;
const Prog=({v,c="bg-blue-600",h="h-2"})=>{const w=useMount(v);return <div className={h+" bg-slate-100 rounded-full overflow-hidden"}><div className={"bar h-full rounded-full "+c} style={{width:w+"%"}}/></div>};
const Ring=({v,size=132,sub})=>{const w=useMount(v),R=52,C=2*Math.PI*R;return <div className="relative shrink-0" style={{width:size,height:size}}><svg viewBox="0 0 120 120" className="w-full h-full -rotate-90"><circle cx="60" cy="60" r={R} fill="none" stroke="#e8eef6" strokeWidth="10"/><circle cx="60" cy="60" r={R} fill="none" stroke="#2563eb" strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-w/100)} style={{transition:"stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"}}/></svg><div className="absolute inset-0 grid place-items-center text-center"><div><p className="text-3xl font-extrabold text-navy-900 leading-none">{v}%</p>{sub&&<p className="text-[10px] text-slate-500 mt-1">{sub}</p>}</div></div></div>};
const Badge=({s})=><span className={"px-2.5 py-0.5 rounded-full text-xs font-medium ring-1 "+TXT[s]}>{s==="Critical"?"Critical Gap":s}</span>;
const Logo=({light})=><span className={"font-extrabold text-xl tracking-tight "+(light?"text-white":"text-navy-900")}><span className="inline-block w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-cy-500 align-middle mr-2 relative"><svg viewBox="0 0 24 24" className="absolute inset-0 p-1.5 text-white" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M3 17c4-9 14-9 18 0M7 17V11M12 17V9M17 17v-6"/></svg></span>Skill<span className="text-cy-400">Bridge</span></span>;

const Avatar=({name,c="w-9 h-9 text-sm"})=><span className={"rounded-full bg-gradient-to-br from-blue-600 to-cy-500 text-white font-bold grid place-items-center shrink-0 "+c}>{(name||"A").trim()[0].toUpperCase()}</span>;
function AuthShell({children}){return <div className="min-h-screen grid place-items-center p-4 fade"><div className="w-full max-w-4xl grid md:grid-cols-5 card overflow-hidden shadow-xl">
<div className="md:col-span-2 bg-navy-900 text-white p-8 flex flex-col justify-between gap-10"><Logo light/><div><p className="text-[11px] tracking-widest font-semibold text-cy-400">CAREER INTELLIGENCE PLATFORM</p><p className="text-2xl font-extrabold leading-snug mt-3">Know your gap. Prove your skills. Become job-ready.</p></div><p className="text-xs text-slate-400">Prototype · data stays on this device</p></div>
<div className="md:col-span-3 p-6 md:p-9">{children}</div></div></div>}
function Welcome({go,guest}){return <AuthShell><div className="h-full flex flex-col justify-center"><p className="text-[11px] tracking-widest font-semibold text-blue-600">WELCOME</p><h1 className="text-3xl font-extrabold text-navy-900 mt-2">SkillBridge</h1><p className="text-slate-500 mt-1">Career Intelligence Platform</p><p className="mt-5 text-slate-600">Know your gap. Prove your skills. Become job-ready.</p>
<div className="mt-8 space-y-3"><Btn onClick={()=>go("Login")} c="w-full !py-3">Get Started</Btn><Btn v="s" onClick={guest} c="w-full !py-3">Continue as Guest</Btn></div>
<button onClick={()=>go("Landing")} className="mt-5 text-sm text-slate-500 hover:text-blue-600 text-left">See product overview →</button></div></AuthShell>}
function Login({go,guest,onLogin}){
const [em,setEm]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");
const submit=()=>{if(!em.trim()||!pw){setErr("Enter your email and password.");return}
const p=rd("sb_profile");if(p&&p.email&&p.email.toLowerCase()===em.trim().toLowerCase()){onLogin(p)}else setErr("No profile found for this email. Create a profile to continue.")};
const inp="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500";
return <AuthShell><p className="text-[11px] tracking-widest font-semibold text-blue-600">LOGIN / CREATE PROFILE</p><h1 className="text-2xl font-extrabold text-navy-900 mt-1 mb-5">Sign in to SkillBridge</h1>
<label className="text-sm font-medium">Email</label><input value={em} onChange={e=>setEm(e.target.value)} placeholder="alex@college.edu" className={inp+" mt-1 mb-3"}/>
<label className="text-sm font-medium">Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password" className={inp+" mt-1"}/>
{err&&<p className="text-xs text-rose-600 mt-2">{err}</p>}
<Btn onClick={submit} c="w-full mt-4 !py-3">Sign In</Btn>
<div className="flex items-center gap-3 my-5 text-xs text-slate-400"><span className="flex-1 h-px bg-slate-200"/>New to SkillBridge?<span className="flex-1 h-px bg-slate-200"/></div>
<Btn v="s" onClick={()=>go("Signup",em)} c="w-full">Create Profile</Btn>
<button onClick={guest} className="mt-4 w-full text-sm text-blue-600 font-medium hover:underline">Continue as Guest</button>
<p className="text-[11px] text-slate-400 mt-4">Prototype sign-in: no server, no email verification. Profiles are stored in this browser only.</p></AuthShell>}
function ProfileForm({init,onSubmit,label,onCancel,reqEmail}){
const [f,setF]=useState(init);const [e,setE]=useState({});
const inp=k=>"w-full border rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 "+(e[k]?"border-rose-400":"border-slate-300");
const lab=(k,l,node)=><div><label className="text-sm font-medium text-slate-700">{l}</label><div className="mt-1">{node}</div>{e[k]&&<p className="text-xs text-rose-600 mt-1">{e[k]}</p>}</div>;
const txt=(k,l,ph)=>lab(k,l,<input value={f[k]} onChange={ev=>setF({...f,[k]:ev.target.value})} placeholder={ph} className={inp(k)}/>);
const sel=(k,l,opts)=>lab(k,l,<select value={f[k]} onChange={ev=>setF({...f,[k]:ev.target.value})} className={inp(k)}>{opts.map(o=><option key={o}>{o}</option>)}</select>);
const submit=()=>{const x={};
if(!f.name.trim())x.name="Full name is required";
if(!f.college.trim())x.college="College / University is required";
if(!f.degree.trim())x.degree="Degree is required";
if(reqEmail&&!f.email.trim())x.email="Email is required";
if(f.email.trim()&&!/^\S+@\S+\.\S+$/.test(f.email.trim()))x.email="Enter a valid email";
setE(x);if(Object.keys(x).length)return;
onSubmit({...f,name:f.name.trim(),email:f.email.trim(),college:f.college.trim(),degree:f.degree.trim()});};
return <div><div className="grid sm:grid-cols-2 gap-4">{txt("name","Full Name","Alex Kumar")}{txt("email","Email","alex@college.edu")}{txt("college","College / University","ABC Engineering College")}{txt("degree","Degree","B.Tech Computer Science")}{sel("year","Year of Study",YEARS)}{sel("role","Target Career Role",ROLES)}{sel("level","Current Skill Level",LEVELS)}{sel("goal","Learning Goal",GOALS)}</div>
<div className="flex flex-wrap gap-3 mt-6"><Btn onClick={submit}>{label}</Btn>{onCancel&&<Btn v="s" onClick={onCancel}>Cancel</Btn>}</div></div>}
function Signup({go,email,guest,onCreate}){return <AuthShell><p className="text-[11px] tracking-widest font-semibold text-blue-600">CREATE PROFILE</p><h1 className="text-2xl font-extrabold text-navy-900 mt-1 mb-5">Build your career profile</h1>
<ProfileForm reqEmail init={{...DEMO_USER,name:"",email:email||"",college:"",degree:""}} label="Create My Career Profile" onSubmit={onCreate}/>
<div className="flex justify-between mt-5 text-sm"><button onClick={()=>go("Login")} className="text-slate-500 hover:text-blue-600">← Back to sign in</button><button onClick={guest} className="text-blue-600 font-medium hover:underline">Continue as Guest</button></div></AuthShell>}

function Landing({go}){
const B=[["01","Identify Skill Gaps","Compare what you know with what your target role demands, skill by skill."],["02","Personalize Your Roadmap","Priorities come from your largest gaps, not a generic course list."],["03","Prove Your Skills","Learn, practice, build and verify, so employers see evidence."]];
const K=[["TARGET ROLE","Full-Stack Developer","text-navy-900 text-base"],["JOB READINESS","64%","text-blue-600"],["CRITICAL GAPS","2","text-rose-600"],["ROADMAP","25%","text-cy-500"]];
return <div className="min-h-screen fade">
<header className="max-w-6xl mx-auto px-5 py-5 flex justify-between items-center"><Logo/><button onClick={()=>go("Career Goal")} className="text-sm font-medium text-slate-600 hover:text-blue-600">Explore roles</button></header>
<section className="max-w-6xl mx-auto px-5 pt-10 pb-12 grid lg:grid-cols-2 gap-10 items-center">
<div><p className="inline-block text-[11px] font-semibold tracking-widest text-blue-700 bg-blue-100/70 rounded-full px-3 py-1 mb-5">STUDENT CAREER INTELLIGENCE PLATFORM</p>
<h1 className="text-4xl md:text-6xl font-extrabold tracking-tight leading-[1.06] text-navy-900">Know your gap.<br/>Prove your skills.<br/><span className="text-blue-600">Become job-ready.</span></h1>
<p className="mt-6 text-lg text-slate-600 max-w-xl">Compare your current skills with real role requirements, follow a personalized roadmap, and prove your readiness with project evidence.</p>
<div className="mt-8 flex flex-wrap gap-3"><Btn onClick={()=>go("Career Goal")} c="!px-6 !py-3">Analyze My Skills</Btn><Btn v="s" onClick={()=>go("Career Goal")} c="!px-6 !py-3">Explore Career Roles</Btn></div></div>
<div className="card p-6 shadow-xl"><div className="flex items-center justify-between mb-5"><Eyebrow>Alex · Live preview</Eyebrow><span className="text-[10px] font-bold tracking-wider text-emerald-700 bg-emerald-50 rounded px-2 py-0.5">DEMO</span></div>
<div className="grid grid-cols-2 gap-3">{K.map(k=><div key={k[0]} className="rounded-xl bg-slate-50 border border-slate-100 p-4"><Eyebrow>{k[0]}</Eyebrow><p className={"font-extrabold mt-1 "+(k[2].includes("text-base")?k[2]:"text-3xl "+k[2])}>{k[1]}</p></div>)}</div>
<div className="mt-5"><Prog v={64} c="bg-gradient-to-r from-blue-600 to-cy-500"/></div></div></section>
<section className="max-w-6xl mx-auto px-5 grid md:grid-cols-3 gap-4">{B.map(b=><Card key={b[0]} hv><p className="text-sm font-bold text-cy-500 mb-3">{b[0]}</p><h3 className="font-semibold text-lg text-navy-900">{b[1]}</h3><p className="text-slate-600 mt-1 text-sm">{b[2]}</p></Card>)}</section>
<div className="max-w-6xl mx-auto px-5 py-12 flex flex-wrap justify-center gap-2 text-[11px] font-semibold tracking-wider text-slate-500">{["CAREER GOAL","ASSESS","IDENTIFY GAPS","LEARN","PRACTICE","BUILD","PROVE","JOB READY"].map((x,n)=><span key={x} className="flex items-center gap-2">{n>0&&<span className="text-slate-300">→</span>}<span className="px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg shadow-sm">{x}</span></span>)}</div></div>}
function Dash({skills,go,st,rm,user}){
const p=pct(skills),ks=Object.keys(REQ),c=s=>ks.filter(k=>status(REQ[k],skills[k])===s).length;
const rp=Math.round(rm/8*100);
const kp=[["JOB READINESS",p+"%","border-l-blue-600"],["CRITICAL GAPS",c("Critical"),"border-l-rose-500"],["SKILLS DEVELOPING",c("Developing"),"border-l-amber-400"],["ROADMAP PROGRESS",rp+"%","border-l-cy-500"]];
const top=ks.filter(k=>REQ[k]>skills[k]).sort((a,b)=>(REQ[b]-skills[b])-(REQ[a]-skills[a])||skills[a]-skills[b]||REQ[b]-REQ[a]).slice(0,3);
const nx=skills.React<4?["React Fundamentals","5 days"]:["Spring Boot Fundamentals","5 days"];
return <div className="fade"><div className="mb-7"><h1 className="text-3xl font-extrabold tracking-tight text-navy-900">Welcome back, {user.name.split(" ")[0]} 👋</h1><p className="text-sm text-slate-500 mt-1.5">Here's your current path toward becoming a {user.role}.</p></div>
<div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">{kp.map(k=><Card key={k[0]} c={"border-l-4 "+k[2]} hv><Eyebrow>{k[0]}</Eyebrow><p className="text-3xl font-extrabold text-navy-900 mt-1">{k[1]}</p></Card>)}</div>
<div className="grid lg:grid-cols-3 gap-4 mb-4">
<Card c="lg:col-span-2" hv><h3 className="font-semibold text-navy-900 mb-4">Your Career Readiness</h3><div className="flex items-center gap-6"><Ring v={p} size={140} sub={label(p)}/><div className="flex-1"><p className="text-xl font-bold text-navy-900">{label(p)}</p><p className="text-sm text-slate-500 mt-1">Measured across {ks.length} skills required for {user.role} roles.</p><button onClick={()=>go("Job Readiness")} className="text-sm text-blue-600 font-medium mt-3 hover:underline">See breakdown →</button></div></div></Card>
<Card c="!bg-navy-900 !border-navy-800 text-white" hv><Eyebrow><span className="text-cy-400">NEXT BEST ACTION</span></Eyebrow><p className="text-xl font-bold mt-2">{nx[0]}</p><p className="text-xs text-cy-400 mt-0.5">{nx[1]}</p><p className="text-sm text-slate-300 mt-2">Close your highest-priority skill gap.</p><button onClick={()=>go("Roadmap")} className="mt-4 px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500 transition">Continue Roadmap</button></Card></div>
<Card><h3 className="font-semibold text-navy-900 mb-3">Priority Skill Gaps</h3>{top.length?<div className="divide-y divide-slate-100">{top.map(k=>{const s=status(REQ[k],skills[k]);return <button key={k} onClick={()=>go("Skill Gaps")} className="w-full flex flex-wrap items-center justify-between gap-2 py-3 text-left hover:bg-slate-50 rounded-lg px-2 -mx-2 transition"><span className="font-medium text-navy-900">{k}</span><span className="flex items-center gap-4 text-xs text-slate-500"><span>Current {skills[k]}/5</span><span>Required {REQ[k]}/5</span><Badge s={s}/></span></button>})}</div>:<p className="text-sm text-emerald-600">No open gaps. Great work.</p>}</Card></div>}
function Goal({role,setRole,go}){
const [jd,setJd]=useState("");const [open,setOpen]=useState(false);
return <div className="fade max-w-3xl"><Title t="What role are you targeting?" s="Benchmark your skills against the requirements of your selected role."/>
<div className="grid sm:grid-cols-2 gap-3">{ROLES.map(r=>{const on=r===role;return <button key={r} onClick={()=>setRole(r)} className={"card hv text-left p-4 flex items-center gap-3 "+(on?"!border-blue-600 ring-2 ring-blue-600 bg-blue-50":"")}><span className={"w-5 h-5 rounded-full border-2 grid place-items-center text-[10px] text-white shrink-0 "+(on?"bg-blue-600 border-blue-600":"border-slate-300")}>{on?"✓":""}</span><span className="font-semibold text-navy-900">{r}</span>{r==="Full-Stack Developer"&&<span className="ml-auto text-[10px] font-bold tracking-wider text-cy-500">DEMO</span>}</button>})}</div>
{role!=="Full-Stack Developer"&&<p className="text-xs text-amber-700 bg-amber-50 rounded-lg p-2 mt-3">The demo is fully configured for Full-Stack Developer. Other roles reuse its skill model.</p>}
<Card c="mt-4"><button onClick={()=>setOpen(!open)} className="text-sm text-blue-600 font-medium hover:underline">{open?"Hide":"Paste Job Description"}</button>
{open&&<textarea value={jd} onChange={e=>setJd(e.target.value)} rows={5} placeholder="Paste a job description to extract required skills" className="mt-3 w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>}</Card>
<Btn onClick={()=>go("Skill Assessment")} c="mt-5">Continue to Assessment</Btn></div>}
function Assess({onDone}){
const [i,setI]=useState(0);const [a,setA]=useState({});const [done,setDone]=useState(false);const q=QS[i];
const next=()=>{if(i<QS.length-1)setI(i+1);else{const s={};QS.forEach((x,n)=>s[x[0]]=a[n]+1);setDone(true);setTimeout(()=>onDone(s),1100);}};
if(done)return <div className="fade max-w-2xl"><Card c="text-center py-12"><span className="w-14 h-14 rounded-full bg-emerald-500 text-white text-2xl grid place-items-center mx-auto mb-4">✓</span><h2 className="text-2xl font-extrabold text-navy-900">Assessment Complete</h2><p className="text-sm text-slate-500 mt-1">Preparing your skill gap analysis…</p></Card></div>;
return <div className="fade max-w-2xl"><Title t="Skill Assessment" s="Answer honestly. This sets your starting levels."/>

const prof=<div className="mx-3 mb-3"><button onClick={()=>go("Profile")} className={"w-full flex items-center gap-3 p-2.5 rounded-xl text-left transition "+(page==="Profile"?"bg-blue-600":"hover:bg-navy-800")}><Avatar name={user.name}/><span className="min-w-0"><span className="block text-sm font-semibold text-white truncate">{user.name}</span><span className="block text-xs text-slate-400 truncate">{user.role}</span></span></button><button onClick={()=>go("Welcome")} className="mt-1 ml-2 text-[11px] text-slate-400 hover:text-white">{mode==="guest"?"Exit demo":"Sign out"}</button></div>;
const nav=<nav className="px-3 space-y-1">{NAV.map(n=>{const on=page===n||(page==="Skill Detail"&&n==="Skill Gaps");return <button key={n} onClick={()=>go(n)} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition "+(on?"bg-blue-600 text-white shadow":"text-slate-300 hover:bg-navy-800 hover:text-white")}><Icon n={n}/>{n}</button>})}</nav>;
const foot=<div className="m-3 p-4 rounded-xl bg-navy-800"><p className="text-[10px] tracking-widest text-cy-400 font-semibold">CAREER GOAL</p><p className="text-sm font-semibold text-white mt-1">{role}</p><div className="mt-3"><Prog v={p} c="bg-cy-500" h="h-1.5"/></div><p className="text-xs text-slate-400 mt-1.5">{p}% job-ready</p></div>;
return <div className="min-h-screen md:flex">
<aside className="hidden md:flex flex-col w-64 bg-navy-900 shrink-0 sticky top-0 h-screen"><button onClick={()=>go("Landing")} className="px-6 pt-6 pb-2 text-left"><Logo light/></button><div className="px-6 pb-4">{demo}</div><div className="flex-1 overflow-y-auto">{nav}</div>{foot}{prof}</aside>
<div className="md:hidden flex justify-between items-center bg-navy-900 px-4 py-3 sticky top-0 z-10"><span className="flex items-center gap-2"><Logo light/>{demo}</span><button onClick={()=>setMenu(!menu)} className="text-sm text-white">{menu?"Close":"Menu"}</button></div>
{menu&&<div className="md:hidden bg-navy-900 pb-2">{nav}{foot}{prof}</div>}
<main className="flex-1 min-w-0 p-5 md:p-10 max-w-6xl">{body()}</main></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
